name: generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg (teal theme)
        uses: Platane/snk@v3
        with:
          github_user_name: utkarshhzz
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2EE6D6&color_dots=#0A0E14,#163832,#1f5c52,#2ee6d6,#7fffd4

      - name: push svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
